name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download RoadWatch dual-angle YOLO models
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            -o app/src/main/assets/yolo26n_w8a32.tflite \
            https://github.com/ultralytics/yolo-flutter-app/releases/download/v0.6.6/yolo26n_w8a32.tflite
          curl -L --fail --retry 3 \
            -o app/src/main/assets/yolo26n_obb_w8a32.tflite \
            https://github.com/ultralytics/yolo-flutter-app/releases/download/v0.6.6/yolo26n-obb_w8a32.tflite
          test $(stat -c%s app/src/main/assets/yolo26n_w8a32.tflite) -gt 2000000
          test $(stat -c%s app/src/main/assets/yolo26n_obb_w8a32.tflite) -gt 2000000
          echo "d9cef07ce652ccfa9ce58e4ac8a4df98ff037739a9dad20a8afcae21b545df73  app/src/main/assets/yolo26n_w8a32.tflite" | sha256sum -c -
          echo "259b8b41e290f9431eae816e86b33422a53eac490a8ea2715f70d6da798ba5d3  app/src/main/assets/yolo26n_obb_w8a32.tflite" | sha256sum -c -

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadWatchAI-v9-1-fast-pass-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
